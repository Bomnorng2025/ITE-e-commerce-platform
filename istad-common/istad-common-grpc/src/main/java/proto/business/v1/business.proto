syntax = "proto3";

package business.v1;

option java_multiple_files = true;
option java_package = "kh.edu.istad.platform.common.grpc.business.v1";
option java_outer_classname = "BusinessProto";

service BusinessService {

  rpc GetBusiness(GetBusinessRequest)
      returns (GetBusinessResponse);

}

message GetBusinessRequest {
  string business_id = 1;
}

message GetBusinessResponse {
  string id = 1;
  string name = 2;
  bool active = 3;
}
