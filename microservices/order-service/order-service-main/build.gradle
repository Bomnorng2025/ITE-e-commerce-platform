plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}


dependencies {
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    compileOnly 'org.mapstruct:mapstruct:1.6.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'


    implementation('kh.edu.istad:order-domain-core')
    implementation('kh.edu.istad:order-application-service')
    implementation('kh.edu.istad:order-service-persistence')
    implementation('kh.edu.istad:order-service-restapi')

    implementation("org.springframework.boot:spring-boot-starter-webflux")
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

test {
    useJUnitPlatform()
}