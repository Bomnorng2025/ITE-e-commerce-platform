server:
  port: 9999

spring:
  application:
    name: gateway-server

  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"

  cloud:
    consul:
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
        fail-fast: false
      discovery:
        health-check-url: "http://host.docker.internal:${server.port}/actuator/health"
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: my-order-service
              uri: lb://order-service
              predicates:
#                - Path=/api/orders/**
                - Path=/my-order/**
              filters:
#                - RewritePath=/api/orders/?(?<segment>.*), /$\{segment}
                - RewritePath=/my-order/?(?<segment>.*), /$\{segment}
            - id: json-placeholder
              uri: http://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: "health, gateway"
  endpoint:
    gateway:
      access: read_only
